[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steercurrent"
version = "0.1.0"
description = "Interactive educational app exploring current, charge, fields, and energy flow in a single-loop circuit"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gmsh>=4.11,<5",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=7", "scikit-fem>=11,<13"]
browser-test = ["playwright>=1.50,<2"]

[project.scripts]
steercurrent-web = "steercurrent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
"steercurrent.web" = ["static/*.html", "static/*.css", "static/*.js", "static/*.json"]
